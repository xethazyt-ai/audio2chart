defaults:
  - default.yaml
  - model: audio_codec
  - _self_


# Add audio encoder lr
optimizer:
  # Fine-tuning, not training from scratch: 1e-3 is the from-scratch LR and would wash
  # the pretrained weights out in the first few hundred steps.
  lr: 1e-4
  lr_audio: 1e-3          # unused while model.freeze_encoder is true
  # Measured on the 3060 Ti: 9.1 s per batch, and one batch per song, so an epoch over
  # ~11,000 training songs is about 28 hours and yields ~2,750 optimizer steps at the
  # accumulation below. The repo defaults (warmup 750, max 30000) and my first pass
  # (warmup 500, max 200000) were both written for a machine that gets far more steps
  # per epoch -- warmup alone would not have finished inside a full epoch here.
  warmup_steps: 200
  max_steps: 6000         # roughly two epochs

data:
  root_folder: G:/a2c_data
  window_seconds: 30
  # 20 ms, not 40: 26.2% of 30 s windows in this corpus contain an interval shorter than
  # 40 ms (only 8.8% are shorter than 20 ms), and discretize_time raises on collisions.
  grid_ms: 20
  # ...which still leaves 8.8%; 'skip' drops those windows instead of killing the run.
  error_policy: skip

loader:
  augment: false
  # The tensor the model sees holds batch_size * num_pieces sequences, not batch_size:
  # _collate_batch_impl flattens num_pieces windows out of every song into the batch. At
  # grid_ms 20 each window is 1502 tokens (30 s / 20 ms, + bos/eos, under max_length 2048),
  # through a 1024-wide, 16-layer decoder. The repo defaults (4 x 6 train, 64 x 1 val)
  # would be 24 and 64 sequences per step -- certain OOM on this card.
  #
  # Measured on the 3060 Ti: 4 sequences per step peaked at 7986 MiB of 8192, and 2 at
  # 7972 -- 14 MiB apart. Memory here is the fixed cost of 230 M parameters plus their
  # gradients and AdamW moments (~3.7 GB in fp32) plus the caching allocator, not the
  # activations, so trading sequences away buys no headroom. Both configurations sit at
  # ~97% of the card and will OOM if anything else claims VRAM.
  #
  # 2 is kept because it is the configuration with a clean measured step time (9.1 s/batch
  # on a quiet drive). Real headroom needs a different lever -- freezing the lower decoder
  # layers would cut gradients and optimizer state, which is where the memory actually is.
  batch_size: 1
  train_num_pieces: 2
  val_batch_size: 1
  val_num_pieces: 1
  num_workers: 4

model:
  # Fine-tune from the released 20 ms checkpoint. The transformer block below must keep
  # matching its config.json or load_pretrained_transformer raises on shape mismatch.
  pretrained: 3podi/charter-v1.0-20-M-best-acc
  transformer:
    d_model: 1024
    d_ff: 4096
    n_heads: 8
    num_kv_heads: 8
    n_layers: 16
    compression: 2

trainer:
  # Defaults to false, which produces no checkpoints at all.
  save_run: true
  # 2 sequences per step x 4 = 8 sequences per optimizer step. Larger accumulation looks
  # attractive but at 9.1 s/batch, 32 would mean 4.9 minutes per optimizer step and only
  # ~344 steps in a 28-hour epoch -- too few for any schedule to do useful work.
  accumulate_grad_batches: 4

tracking:
  enabled: false
  tags: [audio]
