name: discrete_seanet

# The discrete path returns quantiser indices -- int64, no grad_fn -- so no gradient
# can reach the encoder however this is set. Leaving it false only made _encode_audio
# build and retain an Encodec activation graph for a backward pass that never comes:
# measured 4.173 GiB peak against 0.807 GiB under no_grad, for identical codes.
freeze_encoder: true
# Fraction of training input tokens replaced at random, to blunt exposure bias.
# Teacher forcing only ever shows a correct history, so the model drifts on its own
# output: the generated tap rate climbs 0.224 -> 0.723 across one 30s chunk, and at a
# lower sampling temperature collapses to a flat zero taps and zero sustains.
# Declared here so it can be overridden normally -- reading it with a default is not
# enough, Hydra refuses `model.input_noise=X` for a key the config does not define.
input_noise: 0.0
# A local checkpoint to take weights from, with a fresh optimizer.
# Unlike trainer.resume_path this does not restore step count, so a
# checkpoint taken past max_steps can still seed a new run.
init_from: null
use_processor: false
sample_rate: 16000

#Seanet encoder config
encoder:
  _target_: modules.models.SEANetEncoder2d
  in_channels: 1
  base_channels: 64
  dimension: 512
  n_residual_layers: 3
  ratios: [8, 5, 4, 4]         
  kernel_size: 7
  last_kernel_size: 7
  residual_kernel_size: 3
  dilation_base: 2
  use_transformer: true
  config_transformer:
    d_model: 512
    n_heads: 4
    n_layers: 4
    d_ff: 2048
    max_seq_len: 2048
    dropout: 0.2
    use_flash: true

# Transformer decoder config
transformer:
  _target_: modules.training_transformer.TransformerDecoderAudioConditioned

  # --- Model dimensions ---
  d_model: 512                
  d_ff: 2048                  
  n_heads: 8                  
  num_kv_heads: 2
  n_layers: 8      
  dropout: 0.0               

  use_flash: true            
  conditional: false           # If true, expects class embeddings

  rope_base: 10000.0           # Base frequency (common: 10000)
