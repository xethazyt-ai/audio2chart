name: discrete_encodec

freeze_encoder: true
# Fraction of training input tokens replaced at random, to blunt exposure bias.
# Teacher forcing only ever shows a correct history, so the model drifts on its own
# output: the generated tap rate climbs 0.224 -> 0.723 across one 30s chunk, and at a
# lower sampling temperature collapses to a flat zero taps and zero sustains.
# Declared here so it can be overridden normally -- reading it with a default is not
# enough, Hydra refuses `model.input_noise=X` for a key the config does not define.
input_noise: 0.0
# A local checkpoint to take weights from, with a fresh optimizer.
# Unlike trainer.resume_path this does not restore the step count, so a
# checkpoint taken past max_steps can still seed a new run.
init_from: null
use_processor: true
sample_rate: 24000

#Seanet encoder config
encoder:
  _target_: modules.models.Encodec
  checkpoint: facebook/encodec_24khz
  bandwidth: 3.0
  sample_rate: ${model.sample_rate}

#Transformer Decocer config
transformer:
  _target_: modules.training_transformer.TransformerDecoderAudioConditioned

  # --- Model dimensions ---
  d_model: 512                
  d_ff: 2048                  
  n_heads: 8                  
  num_kv_heads: 4
  n_layers: 8      
  dropout: 0.0
  audio_drop: 0.0    
  compression: null
  use_flash: true            
  conditional: false           # If true, expects class embeddings

  rope_base: 10000.0           # Base frequency (common: 10000)
