seed: 42

data:
  root_folder: ../data
  split_folder: null
  validation_split: 0.2
  difficulties: [Expert]
  instruments: [Single]
  max_length: 2048
  error_policy: strict

loader:
  batch_size: 4
  val_batch_size: 64
  num_workers: 8
  train_num_pieces: 6
  val_num_pieces: 1
  max_sample_retries: 5
  max_cache_gb: 20.0
  chart_cache_size: 512

optimizer:
  lr: 1e-3
  weight_decay: 0.01
  warmup_steps: 750
  max_steps: 30000

trainer:
  max_epochs: 200
  gpus: 1
  precision: bf16
  save_run: false
  log_every_n_steps: 10
  early_stopping_patience: 5
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  # `simple` or `advanced` to find out where a step's time actually goes.
  profiler: null
  # Short probe runs: `trainer.max_steps=50 trainer.limit_val_batches=5`
  max_steps: -1
  limit_train_batches: null
  limit_val_batches: null
  # CAREFUL: these two neighbours look symmetrical and count different things.
  # Lightning's val_check_interval counts BATCHES; ModelCheckpoint's every_n_train_steps
  # counts OPTIMIZER STEPS. Setting both to 100 with accumulate_grad_batches=8 ran one
  # validation batch for every training batch and wrote a 2.42 GB checkpoint every 100
  # batches, which took a 2.79 it/s run down to 0.82 it/s with the GPU at 16%.
  # To validate every N optimizer steps, set this to N * accumulate_grad_batches.
  val_check_interval: null
  # Optimizer steps between plain last.ckpt saves, independent of validation. 0 disables.
  checkpoint_every_n_steps: 0
  # Lightning checkpoint to resume from; null starts fresh.
  resume_path: null
  # Where checkpoints and CSV metrics go. Point this at a drive that is NOT holding the
  # songs: each checkpoint is 2.42 GB, and writing it to the corpus drive both runs at
  # 108 MB/s instead of 704 MB/s and stalls the dataloader reading audio beside it.
  log_dir: lightning_logs

tracking:
  enabled: true
  project: audio2chart
  tags: []

logging:
  level: INFO
