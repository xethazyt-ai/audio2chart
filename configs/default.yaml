#Data Config
root_folder: ../data
batch_size: 4
validation_split: 0.2
diff_list: 
  - Expert
  #- Hard
  #- Medium
  #- Easy
inst_list: 
  - Single
max_length: 2048


#Optimizer Config
optimizer:
  lr: 1e-3
  weight_decay: 0.01
  warmup_steps: 750
  max_steps: 30000


#Trainer
max_epochs: 200
gpus: 1
precision: 'bf16'
save_run: false
train_num_pieces: 6
val_num_pieces: 1
val_batch_size: 64
num_workers: 8
log_every_n_steps: 10
early_stopping_patience: 5
gradient_clip_val: 1.0
num_sanity_val_steps: 0


