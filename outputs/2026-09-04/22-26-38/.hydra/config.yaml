seed: 42
data:
  root_folder: G:/a2c_data/bench
  split_folder: null
  validation_split: 0.2
  difficulties:
  - Expert
  instruments:
  - Single
  max_length: 2048
  error_policy: skip
  window_seconds: 30
  grid_ms: 20
loader:
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  train_num_pieces: 4
  val_num_pieces: 1
  max_sample_retries: 5
  augment: false
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 200000
  lr_audio: 0.001
trainer:
  max_epochs: 1
  gpus: 1
  precision: bf16
  save_run: false
  log_every_n_steps: 1
  early_stopping_patience: 5
  gradient_clip_val: 1.0
  accumulate_grad_batches: 16
  num_sanity_val_steps: 0
  max_steps: 20
  limit_train_batches: null
  limit_val_batches: 2
tracking:
  enabled: false
  project: audio2chart
  tags:
  - audio
logging:
  level: INFO
model:
  name: discrete_encodec
  freeze_encoder: true
  use_processor: true
  sample_rate: 24000
  encoder:
    _target_: modules.models.Encodec
    checkpoint: facebook/encodec_24khz
    bandwidth: 3.0
    sample_rate: ${model.sample_rate}
  transformer:
    _target_: modules.training_transformer.TransformerDecoderAudioConditioned
    d_model: 1024
    d_ff: 4096
    n_heads: 8
    num_kv_heads: 8
    n_layers: 16
    dropout: 0.0
    audio_drop: 0.0
    compression: 2
    use_flash: true
    conditional: false
    rope_base: 10000.0
  pretrained: 3podi/charter-v1.0-20-M-best-acc
